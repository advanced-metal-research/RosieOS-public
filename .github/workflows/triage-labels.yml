name: Boundary triage

on:
  pull_request:
    paths:
      - .github/scripts/triage.cjs
      - .github/scripts/triage.test.cjs
      - .github/workflows/triage-labels.yml
  issues:
    types: [opened, reopened]
  pull_request_target:
    types: [opened, reopened]
  schedule:
    - cron: '23 16 * * 1'
  workflow_dispatch:

permissions: {}

jobs:
  test:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - run: node --test .github/scripts/triage.test.cjs

  label:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
      pull-requests: write
    steps:
      # Only main is executed; pull request code is never checked out with a write token.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3
        with:
          script: |
            const { run } = require('./.github/scripts/triage.cjs');
            await run({ github, context, core });
