name: Quality pilot
on:
  pull_request:
    paths: ["coordination/v1/**", "quality/**", ".github/workflows/**"]
  push:
    branches: [main]
    paths: ["coordination/v1/**", "quality/**", ".github/workflows/**"]
permissions:
  contents: read
concurrency:
  group: quality-pilot-${{ github.ref }}
  cancel-in-progress: true
jobs:
  coordination:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22.13.1"
          cache: npm
          cache-dependency-path: coordination/v1/package-lock.json
      - run: npm ci --prefix coordination/v1
      - run: node quality/quality.mjs check
  workflow-syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: "1.26.5"
          cache: false
      - run: node quality/quality.mjs workflows
