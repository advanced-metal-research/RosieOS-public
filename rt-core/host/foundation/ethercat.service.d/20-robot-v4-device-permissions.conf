[Unit]
# Keep the EtherCAT master startup self-contained for clean Robot v4 deploys.
Wants=robot-v4-cpu-performance.service robot-v4-ethercat-nic-tune.service robot-v4-irq-affinity.service
After=robot-v4-cpu-performance.service robot-v4-ethercat-nic-tune.service robot-v4-irq-affinity.service

[Service]
ExecStart=
ExecStart=/usr/local/sbin/ethercatctl -c /etc/ethercat.conf start
ExecStop=
ExecStop=/usr/local/sbin/ethercatctl -c /etc/ethercat.conf stop
ExecStartPost=/bin/sh -c 'for dev in /dev/EtherCAT*; do [ -e "$dev" ] || continue; chgrp picontrol "$dev"; chmod 660 "$dev"; done'
